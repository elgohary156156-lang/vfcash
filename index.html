<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدفع بفودافون كاش</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Cairo,sans-serif;
}

body{
background:linear-gradient(135deg,#e60000,#b00000);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.card{
width:340px;
background:#fff;
padding:35px;
border-radius:25px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.logo{
width:80px;
height:80px;
background:#e60000;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
font-size:36px;
margin:auto;
margin-bottom:20px;
}

h2{
color:#222;
margin-bottom:15px;
}

.number{
font-size:30px;
font-weight:bold;
letter-spacing:1px;
margin:20px 0;
color:#e60000;
}

button{
width:100%;
padding:16px;
margin-top:12px;
border:none;
border-radius:14px;
font-size:18px;
cursor:pointer;
transition:.3s;
}

.copy{
background:#e60000;
color:white;
}

.copy:hover{
transform:scale(1.03);
}

.open{
display:block;
width:100%;
padding:16px;
margin-top:12px;
border-radius:14px;
background:#111;
color:#fff;
text-decoration:none;
font-size:18px;
}

.note{
margin-top:20px;
font-size:14px;
color:#666;
line-height:1.7;
}

.success{
margin-top:12px;
color:green;
font-weight:bold;
display:none;
}
</style>

</head>

<body>

<div class="card">

<div class="logo">💳</div>

<h2>الدفع بفودافون كاش</h2>

<div class="number" id="phone">
01005242871
</div>

<button class="copy" onclick="copyNumber()">
📋 نسخ الرقم
</button>

<a class="open" href="https://vf.eg/vfcash">
📱 فتح فودافون كاش
</a>

<div class="success" id="done">
✅ تم نسخ الرقم
</div>

<div class="note">
بعد فتح التطبيق اختر<br>
تحويل أموال ➜ الصق الرقم ➜ أكمل الدفع
</div>

</div>

<script>

function copyNumber(){

navigator.clipboard.writeText("01005242871");

document.getElementById("done").style.display="block";

setTimeout(()=>{
document.getElementById("done").style.display="none";
},2000);

}

</script>

</body>
</html>
